<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geolocation Information</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
  --walnut: #23160f;
  --walnut-2: #33200f;
  --brass: #c9973f;
  --brass-dark: #7a5620;
  --copper: #b5651d;
  --verdigris: #4f8f7f;
  --parchment: #ecdcb5;
  --ink: #2b1c10;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: "IM Fell English", Georgia, "Times New Roman", serif;
  font-size: 1.1rem;
  line-height: 1.6;
  color: var(--parchment);
  background:
    radial-gradient(ellipse at 50% 0%, #4a2f18 0%, transparent 60%),
    repeating-linear-gradient(90deg, rgba(0,0,0,.18) 0 2px, transparent 2px 46px),
    var(--walnut);
  display: flex;
  justify-content: center;
  padding: 2rem 1rem 3rem;
}
.frame { width: 100%; max-width: 640px; }

/* Header */
header { text-align: center; margin-bottom: 1.5rem; }
.emblem { width: 120px; height: 120px; display: block; margin: 0 auto .5rem; overflow: visible; }
.emblem .gear-big { transform-origin: 60px 60px; }
.emblem .gear-small { transform-origin: 98px 92px; }
.busy .gear-big { animation: spin 3s linear infinite; }
.busy .gear-small { animation: spin 1.6s linear infinite reverse; }
@keyframes spin { to { transform: rotate(360deg); } }
h1 {
  font-family: "Cinzel Decorative", Georgia, serif;
  font-weight: 900;
  font-size: clamp(1.8rem, 6vw, 2.6rem);
  margin: 0;
  color: var(--brass);
  text-shadow: 0 2px 0 #000, 0 0 18px rgba(201,151,63,.35);
}
.subtitle { margin: .25rem 0 0; font-style: italic; color: #cdb98a; }

/* Brass panel with rivets */
.panel {
  position: relative;
  padding: 1.75rem 1.5rem;
  border: 6px solid var(--brass-dark);
  border-radius: 10px;
  background: linear-gradient(160deg, var(--walnut-2), #1a0f08);
  box-shadow: inset 0 0 0 2px var(--brass), inset 0 0 30px #000, 0 10px 30px rgba(0,0,0,.6);
}
.rivet {
  position: absolute; width: 14px; height: 14px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #f3d58a, var(--brass-dark) 70%);
  box-shadow: 0 1px 2px #000;
}
.rivet.tl { top: 8px; left: 8px; } .rivet.tr { top: 8px; right: 8px; }
.rivet.bl { bottom: 8px; left: 8px; } .rivet.br { bottom: 8px; right: 8px; }

/* Form */
label { display: block; margin-bottom: .4rem; color: var(--brass); font-size: 1.15rem; }
.row { display: flex; gap: .75rem; flex-wrap: wrap; }
input[type="text"] {
  flex: 1 1 220px;
  font: inherit; font-size: 1.1rem;
  padding: .7rem .9rem;
  color: var(--ink);
  background: var(--parchment);
  border: 3px solid var(--brass-dark);
  border-radius: 6px;
  box-shadow: inset 0 2px 6px rgba(0,0,0,.45);
}
input::placeholder { color: #8a7650; font-style: italic; }
button {
  font-family: "Cinzel Decorative", Georgia, serif;
  font-weight: 700; font-size: 1rem;
  padding: .7rem 1.4rem;
  color: #2b1c10;
  background: linear-gradient(#e6bd6a, var(--brass) 55%, var(--brass-dark));
  border: 3px solid #4b3213;
  border-radius: 6px;
  cursor: pointer;
  box-shadow: 0 4px 0 #4b3213, 0 6px 10px rgba(0,0,0,.5);
  transition: transform .1s, box-shadow .1s;
}
button:hover { filter: brightness(1.08); }
button:active { transform: translateY(3px); box-shadow: 0 1px 0 #4b3213; }
button:disabled { filter: grayscale(.6); cursor: wait; }
input:focus-visible, button:focus-visible { outline: 3px solid var(--verdigris); outline-offset: 2px; }

/* Result */
#hasil { margin-top: 1.5rem; }
.plate {
  padding: 1rem 1.25rem;
  color: var(--ink);
  background: linear-gradient(135deg, #f1e3bf, #d9c393);
  border: 3px double var(--copper);
  border-radius: 6px;
  box-shadow: inset 0 0 25px rgba(122,86,32,.35);
}
.plate h2 {
  font-family: "Cinzel Decorative", Georgia, serif;
  margin: 0 0 .6rem; font-size: 1.15rem; color: var(--copper);
}
dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: .3rem 1rem; }
dt { font-weight: bold; }
dd { margin: 0; overflow-wrap: anywhere; }
.pesan { padding: .9rem 1.1rem; border-radius: 6px; border: 3px solid; }
.pesan.info { color: #cdb98a; border-color: var(--brass-dark); border-style: dashed; }
.pesan.error { color: #f6d3c2; border-color: var(--copper); background: rgba(181,101,29,.18); }

footer { margin-top: 1.5rem; text-align: center; font-size: .95rem; color: #8f7b52; font-style: italic; }

@media (max-width: 480px) { dl { grid-template-columns: 1fr; } dt { margin-top: .3rem; } }
@media (prefers-reduced-motion: reduce) { .busy .gear-big, .busy .gear-small { animation: none; } }
</style>
</head>
<body>
<div class="frame">
  <header>
    <svg class="emblem" id="emblem" viewBox="0 0 130 130" role="img" aria-label="Emblem roda gigi">
      <defs>
        <radialGradient id="brassG" cx="35%" cy="30%">
          <stop offset="0" stop-color="#f3d58a"/><stop offset="1" stop-color="#7a5620"/>
        </radialGradient>
      </defs>
      <!-- roda gigi besar -->
      <g class="gear-big">
        <circle cx="60" cy="60" r="44" fill="none" stroke="#c9973f" stroke-width="12" stroke-dasharray="5.76 5.76"/>
        <circle cx="60" cy="60" r="38" fill="url(#brassG)" stroke="#4b3213" stroke-width="3"/>
        <circle cx="60" cy="60" r="27" fill="#23160f" stroke="#4b3213" stroke-width="3"/>
        <!-- jarum kompas -->
        <polygon points="60,36 66,60 60,84 54,60" fill="#b5651d"/>
        <polygon points="60,36 66,60 54,60" fill="#ecdcb5"/>
        <circle cx="60" cy="60" r="5" fill="#c9973f" stroke="#4b3213" stroke-width="2"/>
      </g>
      <!-- roda gigi kecil -->
      <g class="gear-small">
        <circle cx="98" cy="92" r="17" fill="none" stroke="#b5651d" stroke-width="8" stroke-dasharray="4.5 4.5"/>
        <circle cx="98" cy="92" r="13" fill="#b5651d" stroke="#4b3213" stroke-width="2.5"/>
        <circle cx="98" cy="92" r="5" fill="#23160f"/>
      </g>
    </svg>
    <h1>Geolocation Information</h1>
    <p class="subtitle">Find your location with ease</p>
  </header>

  <main class="panel">
    <span class="rivet tl"></span><span class="rivet tr"></span>
    <span class="rivet bl"></span><span class="rivet br"></span>

    <form id="form" autocomplete="off">
      <label for="lokasi">Lokasi</label>
      <div class="row">
        <input type="text" id="lokasi" name="lokasi" placeholder="Insert location" required>
        <button type="submit" id="tombol">Cari</button>
      </div>
    </form>

    <div id="hasil" aria-live="polite"></div>
  </main>

</div>

<script>
const form = document.getElementById('form');
const input = document.getElementById('lokasi');
const tombol = document.getElementById('tombol');
const hasil = document.getElementById('hasil');
const emblem = document.getElementById('emblem');

function esc(teks) {
  const d = document.createElement('div');
  d.textContent = teks ?? '-';
  return d.innerHTML;
}

function tampilPesan(teks, tipe) {
  hasil.innerHTML = `<div class="pesan ${tipe}">${esc(teks)}</div>`;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const lokasi = input.value.trim();
  if (!lokasi) return;

  tombol.disabled = true;
  emblem.classList.add('busy');
  tampilPesan('Mesin sedang bekerja, mohon tunggu...', 'info');

  try {
    const res = await fetch('/api/lokasi?lokasi=' + encodeURIComponent(lokasi));
    const data = await res.json();

    if (!res.ok) {
      tampilPesan(data.message || 'Terjadi kesalahan pada server.', 'error');
      return;
    }

    hasil.innerHTML = `
      <div class="plate">
        <h2>${esc(data.lokasi)}</h2>
        <dl>
          <dt>Negara</dt><dd>${esc(data.negara)}</dd>
          <dt>Provinsi</dt><dd>${esc(data.provinsi)}</dd>
          <dt>Kecamatan</dt><dd>${esc(data.kecamatan)}</dd>
          <dt>Latitude</dt><dd>${esc(data.latitude)}</dd>
          <dt>Longitude</dt><dd>${esc(data.longitude)}</dd>
        </dl>
      </div>`;
  } catch (err) {
    tampilPesan('Tidak dapat menghubungi server. Pastikan app.js sedang berjalan.', 'error');
  } finally {
    tombol.disabled = false;
    emblem.classList.remove('busy');
  }
});
</script>
</body>
</html>
